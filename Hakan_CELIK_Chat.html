<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hakan ÇELİK - Yapay Zeka Sohbet</title>
  <style>
    :root{color-scheme:dark;--bg:#070b18;--panel:rgba(17,24,39,.84);--panel-soft:rgba(30,41,59,.8);--border:rgba(148,163,184,.25);--text:#e2e8f0;--muted:#94a3b8;--a:#22d3ee;--a2:#a78bfa;--user:linear-gradient(135deg,#22d3ee,#38bdf8);--bot:rgba(15,23,42,.88)}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:Segoe UI,Arial,sans-serif;color:var(--text);display:grid;place-items:center;background:radial-gradient(circle at 15% 20%,#1d4ed8 0%,transparent 35%),radial-gradient(circle at 85% 0%,#7c3aed 0%,transparent 40%),var(--bg);padding:20px}
    .app{width:min(1000px,100%);height:min(800px,calc(100vh - 40px));border-radius:20px;border:1px solid var(--border);background:var(--panel);box-shadow:0 24px 80px rgba(2,6,23,.55);backdrop-filter:blur(10px);display:grid;grid-template-rows:auto auto auto 1fr auto auto;overflow:hidden}
    header,.toolbar,.quick{padding:10px 14px;border-bottom:1px solid var(--border);background:var(--panel-soft);display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}
    header{padding:16px 20px;background:linear-gradient(90deg,rgba(34,211,238,.12),rgba(167,139,250,.12))}
    .title{font-size:1.1rem;font-weight:700}.sub{color:var(--muted);font-size:.82rem}.dot{width:10px;height:10px;border-radius:50%;background:#4ade80;box-shadow:0 0 12px #4ade80}
    .pill,.btn{border:1px solid rgba(56,189,248,.35);background:rgba(30,41,59,.8);color:#cbd5e1;padding:7px 10px;border-radius:999px;font-size:.82rem;cursor:pointer}
    .btn{border-radius:10px}
    #chat{padding:18px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
    .row{display:flex;gap:9px;align-items:flex-end;max-width:92%}.row.user{margin-left:auto;flex-direction:row-reverse}
    .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:.74rem;font-weight:700;border:1px solid var(--border);background:rgba(2,6,23,.7);color:#bfdbfe;flex-shrink:0}
    .bubble{padding:11px 13px;border-radius:14px;white-space:pre-wrap;line-height:1.4;border:1px solid var(--border);box-shadow:0 8px 24px rgba(2,6,23,.3);background:var(--bot)}
    .row.user .bubble{background:var(--user);color:#062135;border:none;font-weight:600}
    form{border-top:1px solid var(--border);display:grid;grid-template-columns:auto 1fr auto;gap:10px;padding:14px;background:var(--panel-soft);align-items:center}
    input[type=text]{width:100%;font-size:1rem;padding:12px;border-radius:10px;border:1px solid rgba(148,163,184,.4);background:rgba(15,23,42,.88);color:var(--text);outline:none}
    .send{border:none;border-radius:10px;padding:12px 16px;background:linear-gradient(135deg,var(--a),var(--a2));color:#03142e;font-weight:700;cursor:pointer}
    .typing{color:var(--muted);font-size:.85rem;font-style:italic;margin-left:40px;display:none}
    .hint{font-size:.78rem;color:var(--muted);padding:0 15px 14px}
  </style>
</head>
<body>
<div class="app">
  <header>
    <div><div class="title">Hakan ÇELİK - Yapay Zeka Sohbet</div><div class="sub">Dinamik beyin + CoT tarzı iç akıl yürütme + kısa süreli bağlam</div></div>
    <div class="dot"></div>
  </header>
  <div class="toolbar">
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <button class="btn" id="clearMemoryBtn" type="button">🧠 Hafızayı Sıfırla</button>
      <button class="btn" id="uploadBtn" type="button">📎 Dosya / Fotoğraf Ekle</button>
      <span class="pill" id="memoryInfo">Hafıza: yükleniyor...</span>
    </div>
    <small style="color:var(--muted)">Backend: Python FastAPI + RAG-lite</small>
  </div>
  <div class="quick" id="quickActions">
    <button class="pill" type="button">Benim adım Ahmet</button>
    <button class="pill" type="button">Beni hatırlıyor musun?</button>
    <button class="pill" type="button">Bugün nasıl plan yapayım?</button>
    <button class="pill" type="button">Kafam çok karışık</button>
  </div>
  <div id="chat"></div>
  <div class="typing" id="typing">Hakan ÇELİK düşünüyor...</div>
  <form id="chatForm">
    <button class="btn" type="button" id="uploadBtn2">📁 Ekle</button>
    <input id="prompt" type="text" placeholder="Mesajınızı yazın..." required />
    <button class="send" type="submit">Gönder</button>
    <input id="fileInput" type="file" multiple hidden />
  </form>
  <div class="hint">Sunucu modeli son 10 mesaj bağlamını kullanır; yanıtlar sabit kalıp yerine niyet + bilgiye göre üretilir.</div>
</div>

<script>
  const chat = document.getElementById('chat');
  const form = document.getElementById('chatForm');
  const promptInput = document.getElementById('prompt');
  const typing = document.getElementById('typing');
  const quickActions = document.getElementById('quickActions');
  const memoryInfo = document.getElementById('memoryInfo');
  const clearMemoryBtn = document.getElementById('clearMemoryBtn');
  const uploadBtn = document.getElementById('uploadBtn');
  const uploadBtn2 = document.getElementById('uploadBtn2');
  const fileInput = document.getElementById('fileInput');

  const SESSION_KEY = 'hakan_session_id';
  const CHAT_KEY = 'hakan_front_chat_v3';
  let pendingFiles = [];

  const sessionId = (() => {
    let id = localStorage.getItem(SESSION_KEY);
    if (!id) {
      id = `sess_${Date.now()}_${Math.random().toString(16).slice(2, 10)}`;
      localStorage.setItem(SESSION_KEY, id);
    }
    return id;
  })();

  function addMessage(text, role, persist = true) {
    const row = document.createElement('div');
    row.className = `row ${role === 'user' ? 'user' : ''}`;
    const av = document.createElement('div');
    av.className = 'av'; av.textContent = role === 'user' ? 'Siz' : 'HC';
    const bubble = document.createElement('div');
    bubble.className = 'bubble'; bubble.textContent = text;
    row.append(av, bubble);
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
    if (persist) {
      const logs = JSON.parse(localStorage.getItem(CHAT_KEY) || '[]');
      logs.push({ role, text });
      localStorage.setItem(CHAT_KEY, JSON.stringify(logs.slice(-80)));
    }
  }

  function restoreChat() {
    const logs = JSON.parse(localStorage.getItem(CHAT_KEY) || '[]');
    logs.forEach((m) => addMessage(m.text, m.role, false));
    if (!logs.length) addMessage('Merhaba! Ben Hakan ÇELİK. Seni hatırlayan ve bağlamı koruyan yerel bir AI asistanıyım.');
  }

  async function refreshMemory() {
    try {
      const res = await fetch(`/api/memory/${sessionId}`);
      if (!res.ok) throw new Error('memory');
      const m = await res.json();
      memoryInfo.textContent = `Hafıza | İsim: ${m.name || 'yok'} | Niyet: ${m.last_intent || 'yok'} | Mesaj: ${m.history_items}`;
    } catch {
      memoryInfo.textContent = 'Hafıza: sunucuya bağlanamadı';
    }
  }

  async function sendMessage(text) {
    addMessage(text, 'user');
    if (pendingFiles.length) {
      addMessage(`Ek dosyalar: ${pendingFiles.map((f) => f.name).join(', ')}`, 'user');
      pendingFiles = [];
      fileInput.value = '';
    }
    typing.style.display = 'block';
    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: sessionId, message: text })
      });
      if (!res.ok) throw new Error('chat');
      const data = await res.json();
      const sourceText = data.sources?.length ? `\n\nKaynaklar: ${data.sources.map((s) => s.source).join(', ')}` : '';
      addMessage(`${data.reply}${sourceText}`, 'assistant');
      await refreshMemory();
    } catch {
      addMessage('Sunucuya bağlanamadım. `python launcher.py` ile API sunucusunu başlatıp tekrar dener misin?', 'assistant');
    } finally {
      typing.style.display = 'none';
    }
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const t = promptInput.value.trim();
    if (!t) return;
    promptInput.value = '';
    await sendMessage(t);
  });

  quickActions.addEventListener('click', async (e) => {
    if (!(e.target instanceof HTMLButtonElement)) return;
    await sendMessage(e.target.textContent || 'Merhaba');
  });

  clearMemoryBtn.addEventListener('click', () => {
    localStorage.removeItem(CHAT_KEY);
    localStorage.removeItem(SESSION_KEY);
    location.reload();
  });

  uploadBtn.addEventListener('click', () => fileInput.click());
  uploadBtn2.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', (e) => {
    pendingFiles = Array.from(e.target.files || []);
    if (pendingFiles.length) addMessage(`Yüklenecek dosyalar hazır: ${pendingFiles.map((f) => f.name).join(', ')}`, 'assistant');
  });

  restoreChat();
  refreshMemory();
</script>
</body>
</html>
